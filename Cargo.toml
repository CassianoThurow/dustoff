[package]
name = "dustoff"
version = "0.1.0"
edition = "2021"
description = "A safe, interactive Linux cleanup tool for developers"
license = "MIT"
repository = "https://github.com/CassianoThurow/dustoff"
keywords = ["linux", "cleanup", "cli", "docker", "cache"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dirs = "6.0"
humansize = "2.1"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
